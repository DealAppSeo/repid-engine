# HyperDAG autonomous build-loop — FULLY CLOUD (zero local footprint).
# Runs ONE "beat" of the loop inside GitHub Actions. Setup: docs/CLOUD_BUILD_LOOP_SETUP.md
#
# BEFORE ENABLING — add two repo secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  — Anthropic API key. THIS BILLS: the loop calls Claude each run.
#   LOOP_GH_PAT        — a fine-grained PAT (this repo: Contents = Read/Write, Pull requests = Read/Write).
#                        A PAT (not the default GITHUB_TOKEN) is REQUIRED so the PRs the loop opens
#                        actually trigger the CI / crosscheck / gitleaks checks (github-actions[bot]
#                        pushes do NOT trigger downstream workflows — a GitHub anti-recursion rule).
#
# Test with "Run workflow" (workflow_dispatch) FIRST. Once a beat looks good, uncomment the schedule
# below AND disable the LOCAL scheduled task, so the loop never runs in two places at once.
name: hyperdag-build-loop-cloud

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus/override for this beat'
        required: false
  schedule:
    - cron: '7 */4 * * *'    # :07 every 4th hour (UTC) — 6 beats/day
    # Enabled 2026-08-26 after Beat 63 (the first-ever run of this workflow,
    # #478) verified end-to-end: secrets resolve, the PAT is a real user
    # token (not github-actions[bot], so it actually triggers downstream CI),
    # build/test are clean modulo one pre-documented env-only failure, and
    # the beat's own diagnostic report reached main as a real PR on the real
    # path. Sean approved enabling this in the session that ran Beat 63.
    #
    # Cadence set to every 4 hours, not hourly, from the very first scheduled
    # firing (Beat 64, #480): that beat cost $1.55 in real API spend hitting
    # the 40-turn cap, and hourly would run this 24x/day — roughly $750-1500/mo
    # unattended. Every 4 hours is 6 beats/day, ~75% cheaper, while still
    # making steady daily progress on the backlog. Reconsider once there's a
    # few weeks of real per-beat cost data to size against actual value
    # delivered, rather than guessing further from one data point.
    #
    # ⚠ Beat 63 also flagged: PRs #463-#477 landed 2026-08-22→08-26 through
    # some path this ledger never recorded — if a LOCAL scheduled task is
    # still what produced those, it should be disabled now so the two loops
    # don't run concurrently (double PRs, wasted spend, possible conflicts).

concurrency:
  group: hyperdag-build-loop-cloud
  cancel-in-progress: false   # never interrupt a beat mid-flight

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # hard per-beat cap (cost + runaway guard)
    steps:
      - name: Checkout (PAT so opened PRs trigger CI)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LOOP_GH_PAT }}

      - name: Git identity
        run: |
          git config user.name "hyperdag-loop[bot]"
          git config user.email "loop@users.noreply.github.com"

      - name: Run one autonomous beat
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.LOOP_GH_PAT }}
          prompt: |
            You are the HyperDAG autonomous build-loop, executing ONE beat inside GitHub Actions
            (fully cloud — nothing runs on Sean's machine). Working repo = this checkout.

            FIRST read: reports/2026-07-25/AUTONOMOUS_LOOP_CONTRACT.md, the last 2 beats of
            reports/2026-07-25/AUTONOMOUS_LOOP_LEDGER.md, and reports/2026-07-26/PATENT_ALIGNED_BUILD_BACKLOG.md.

            PRIORITY (Sean 2026-07-27): audit-evidence first; favor the work that touches
            the MOST SURFACES ("do more with less"). Optional extra focus this run: ${{ github.event.inputs.focus }}

            TURN BUDGET — READ THIS FIRST, IT IS WHY THE ORDER BELOW CHANGED.
            You have a hard 40-turn cap. MEASURED 2026-08-29: FOUR of the five scheduled runs since
            this workflow was enabled (2026-08-26/27) hit that cap mid-investigation and died before
            the ledger was ever written. The latest, run 33273165759, ended `error_max_turns` at 41
            turns, $1.06, 5 minutes, with nothing logged. Real PRs shipped (#480, #482, #483) with
            ZERO ledger entries for any of them.

            THE PREVIOUS VERSION OF THIS PROMPT ALREADY KNEW THAT AND STILL FAILED, four times. It
            listed the ledger as step (e) — last — and then asked, in a sub-clause of that last item,
            for it to be done early. An agent reading a lettered list executes it in order. The prose
            said "do this first"; the structure said "do this fifth"; the structure won. So the order
            below IS the fix — the ledger is now step 1, not a note attached to step 5.

            The interactive ledger entries you may read for style (Beats 55-63) each spent an entire
            unbounded session on one beat. Do not use them as a length or depth target here.

            Budget: (1) 8-12 turns, (2)+(3) 15-20, (4) 3-5, (5) 3. STOP adding scope at ~30 turns.

            A BEAT THAT DOES ONLY STEP 1 IS A COMPLETE BEAT. If the top backlog item is too large to
            land inside the remaining turns, say so in the ledger and stop. An honest "verified the
            prior beat, backlog item X needs more than one beat, not started" is a real result. Half
            a feature plus no record is not — it is the failure this loop keeps producing.

            THE BEAT:
              (1) LEDGER FIRST — THIS IS THE ONE STEP THAT MUST SURVIVE.
                  Verify the prior beat INDEPENDENTLY (its diff + its CI conclusion via gh) — never
                  rubber-stamp, but keep it proportionate: confirm the claim, do not re-derive it.
                  Then IMMEDIATELY append a Beat entry to
                  reports/2026-07-25/AUTONOMOUS_LOOP_LEDGER.md on its OWN small docs-only branch,
                  open the PR, and `gh pr merge <n> --auto --squash` it. Record what you verified and
                  what you INTEND to do in steps 2-4. Do not start step 2 until that PR is open.
                  Main has branch protection, so there is no direct-push shortcut; a small early PR
                  is the only thing that survives hitting the cap later.
              (2) advance the highest-priority OPEN backlog item on a NEW branch cut from origin/main.
              (3) you are in the cloud runner — you MAY run `npm install --legacy-peer-deps` + `tsc`/`npm test`
                  here to sanity-check (it costs runner minutes, not Sean's box); the required CI is the authority.
              (4) push the branch, open a PR, and — ONLY if SAFE-CLASS (docs / shadow-inert / additive-tested) —
                  run `gh pr merge <n> --auto --squash` WHILE its checks are still pending, so GitHub lands it on green.
              (5) IF TURNS REMAIN, append a short second entry saying what step 2 actually shipped and
                  how it differed from the intent you logged in step 1. If turns do not remain, step 1
                  already told the truth about this beat and nothing is lost — which is the whole point
                  of the reorder. Never skip step 1 to make room for step 5.

            HARD LINES: verify before asserting ([V] not [R]); SHADOW-FIRST — NEVER flip Sean-gated enable flags
            (ENGINE_LLM_PROXY, ROUTER_STRICT_COST_ORDER, HAL_GROUNDING_MODE=enforce, REPID_PURPOSE_GATE_V3,
            real-money X402/STAKE); no secrets in code; NEVER an immediate/manual merge (only --auto on safe-class);
            never bulk-delete trinity_tasks; surface to Sean (in the ledger) ONLY a ready-merge-needing-him, a
            secret/infra flip, or a real fork. Keep this beat bounded and STOP when it is done.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools Edit,Read,Write,Bash,Glob,Grep

  # Beats 64-67 all showed the same failure: the 40-turn cap kills the `beat`
  # job mid-investigation, real PRs still land (auto-merge was already set
  # before the runner died), but step 1 — the ledger entry — never ran
  # because it depended on the agent having turns left. A prompt-text fix
  # (Beat 65) held for exactly one run (Beat 66) then failed the next two
  # (Beat 67). This job is the structural fix: it runs unconditionally,
  # burns zero LLM turns, and only ever writes a bare factual stub — it
  # never substitutes for a real analytical entry, it just guarantees one
  # exists.
  ledger-fallback:
    needs: beat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (PAT so the opened PR triggers CI)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LOOP_GH_PAT }}

      - name: Backfill a ledger entry if the beat job didn't write one
        env:
          GH_TOKEN: ${{ secrets.LOOP_GH_PAT }}
          RUN_ID: ${{ github.run_id }}
          BEAT_RESULT: ${{ needs.beat.result }}
        run: |
          set -euo pipefail
          LEDGER_FILE="reports/2026-07-25/AUTONOMOUS_LOOP_LEDGER.md"

          RUN_JSON=$(gh run view "$RUN_ID" --json createdAt,url)
          RUN_START=$(echo "$RUN_JSON" | jq -r .createdAt)
          RUN_URL=$(echo "$RUN_JSON" | jq -r .url)

          # Has any PR touching the ledger file merged since this run started?
          LEDGER_HITS=$(gh pr list --state merged --limit 30 --json mergedAt,files \
            --jq "[.[] | select(.mergedAt >= \"$RUN_START\") | select(any(.files[]; .path == \"$LEDGER_FILE\"))] | length")

          # Also check OPEN PRs (including ones with auto-merge pending on checks):
          # the beat job can create+push its own ledger PR and die (turn cap) before
          # GitHub finishes the async auto-merge, which lands seconds-to-minutes later.
          # Checking only `merged` missed that window and produced a duplicate stub
          # (PR #503, run 33189498276) alongside the beat job's own real entry (#502).
          OPEN_LEDGER_HITS=$(gh pr list --state open --limit 30 --json createdAt,files \
            --jq "[.[] | select(.createdAt >= \"$RUN_START\") | select(any(.files[]; .path == \"$LEDGER_FILE\"))] | length")

          if [ "$LEDGER_HITS" != "0" ] || [ "$OPEN_LEDGER_HITS" != "0" ]; then
            echo "A ledger PR already merged or open since $RUN_START — the beat job did its own job. No-op."
            exit 0
          fi

          echo "No ledger PR found since $RUN_START (beat result: $BEAT_RESULT) — writing a fallback stub."

          SHIPPED=$(gh pr list --state merged --limit 30 --json number,title,mergedAt \
            --jq "[.[] | select(.mergedAt >= \"$RUN_START\")] | sort_by(.mergedAt) | .[] | \"- #\(.number) \(.title) (merged \(.mergedAt))\"")

          BRANCH="docs/loop-ledger-fallback-${RUN_ID}"
          git checkout -b "$BRANCH"
          git config user.name "hyperdag-loop[bot]"
          git config user.email "loop@users.noreply.github.com"

          {
            echo ""
            echo "## Beat (auto-logged, run ${RUN_ID}) — agent did not reach step 1 (ledger)"
            echo ""
            echo "**Auto-generated by the ledger-fallback job** — the \`beat\` job (result: \`${BEAT_RESULT}\`) did not open its own ledger entry before this job ran. Run: ${RUN_URL}"
            echo ""
            echo "PRs merged during this run's window (since ${RUN_START}):"
            if [ -z "$SHIPPED" ]; then
              echo "- (none detected)"
            else
              echo "$SHIPPED"
            fi
            echo ""
            echo "The ledger is step 1 as of 2026-08-29, so a run reaching THIS fallback died before it could verify the prior beat and open a one-file docs PR — much earlier than the turn-cap deaths this fallback was built for. Check the run's own log for the real cause before assuming budget. This is a bare factual stub, not analysis — the next beat should read this run's own log (\`gh run view ${RUN_ID} --log\`) if the reason matters."
          } >> "$LEDGER_FILE"

          git add "$LEDGER_FILE"
          git commit -m "docs(loop): auto-logged fallback entry for run ${RUN_ID} (beat result: ${BEAT_RESULT})"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "docs(loop): auto-logged fallback entry for run ${RUN_ID}" \
            --body "Auto-generated by the ledger-fallback job — the beat job did not append its own ledger entry (result: \`${BEAT_RESULT}\`). Lists every PR merged during this run's window, nothing more." \
            --base main --head "$BRANCH")
          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          gh pr merge "$PR_NUM" --auto --squash
