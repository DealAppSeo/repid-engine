# HyperDAG autonomous build-loop — FULLY CLOUD (zero local footprint).
# Runs ONE "beat" of the loop inside GitHub Actions. Setup: docs/CLOUD_BUILD_LOOP_SETUP.md
#
# BEFORE ENABLING — add two repo secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  — Anthropic API key. THIS BILLS: the loop calls Claude each run.
#   LOOP_GH_PAT        — a fine-grained PAT (this repo: Contents = Read/Write, Pull requests = Read/Write).
#                        A PAT (not the default GITHUB_TOKEN) is REQUIRED so the PRs the loop opens
#                        actually trigger the CI / crosscheck / gitleaks checks (github-actions[bot]
#                        pushes do NOT trigger downstream workflows — a GitHub anti-recursion rule).
#
# Test with "Run workflow" (workflow_dispatch) FIRST. Once a beat looks good, uncomment the schedule
# below AND disable the LOCAL scheduled task, so the loop never runs in two places at once.
name: hyperdag-build-loop-cloud

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus/override for this beat'
        required: false
  schedule:
    - cron: '7 */4 * * *'    # :07 every 4th hour (UTC) — 6 beats/day
    # Enabled 2026-08-26 after Beat 63 (the first-ever run of this workflow,
    # #478) verified end-to-end: secrets resolve, the PAT is a real user
    # token (not github-actions[bot], so it actually triggers downstream CI),
    # build/test are clean modulo one pre-documented env-only failure, and
    # the beat's own diagnostic report reached main as a real PR on the real
    # path. Sean approved enabling this in the session that ran Beat 63.
    #
    # Cadence set to every 4 hours, not hourly, from the very first scheduled
    # firing (Beat 64, #480): that beat cost $1.55 in real API spend hitting
    # the 40-turn cap, and hourly would run this 24x/day — roughly $750-1500/mo
    # unattended. Every 4 hours is 6 beats/day, ~75% cheaper, while still
    # making steady daily progress on the backlog. Reconsider once there's a
    # few weeks of real per-beat cost data to size against actual value
    # delivered, rather than guessing further from one data point.
    #
    # ⚠ Beat 63 also flagged: PRs #463-#477 landed 2026-08-22→08-26 through
    # some path this ledger never recorded — if a LOCAL scheduled task is
    # still what produced those, it should be disabled now so the two loops
    # don't run concurrently (double PRs, wasted spend, possible conflicts).

concurrency:
  group: hyperdag-build-loop-cloud
  cancel-in-progress: false   # never interrupt a beat mid-flight

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # hard per-beat cap (cost + runaway guard)
    steps:
      - name: Checkout (PAT so opened PRs trigger CI)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LOOP_GH_PAT }}

      - name: Git identity
        run: |
          git config user.name "hyperdag-loop[bot]"
          git config user.email "loop@users.noreply.github.com"

      - name: Run one autonomous beat
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.LOOP_GH_PAT }}
          prompt: |
            You are the HyperDAG autonomous build-loop, executing ONE beat inside GitHub Actions
            (fully cloud — nothing runs on Sean's machine). Working repo = this checkout.

            FIRST read: reports/2026-07-25/AUTONOMOUS_LOOP_CONTRACT.md, the last 2 beats of
            reports/2026-07-25/AUTONOMOUS_LOOP_LEDGER.md, and reports/2026-07-26/PATENT_ALIGNED_BUILD_BACKLOG.md.

            PRIORITY (Sean 2026-07-27): audit-evidence first; favor the work that touches
            the MOST SURFACES ("do more with less"). Optional extra focus this run: ${{ github.event.inputs.focus }}

            TURN BUDGET (read before starting — this is why Beats 64-67 never got logged):
            you have a hard 40-turn cap. Three of the four scheduled runs since this workflow was
            enabled (2026-08-26/27) hit that cap mid-investigation and were killed before step (e)
            ever ran — real PRs shipped (#480, #482, #483) with ZERO ledger entries for any of them.
            The interactive-session ledger entries you read for style (Beats 55-63) each spent an
            entire unbounded session on one beat; do not use them as a length or depth target here.
            Budget roughly: (a) 5-8 turns, (b)+(c) 15-20 turns, (d) 3-5 turns, (e) 5 turns, and STOP
            adding scope once you are ~30 turns in — ship a shorter, real ledger entry over a longer
            one that never gets written. A one-paragraph (e) that lands beats a thorough one that doesn't.

            THE BEAT:
              (a) INDEPENDENTLY verify the prior beat by reading its diff + its CI conclusion (gh) — never rubber-stamp.
                  Keep this proportionate (see budget above): confirm the claim, don't re-derive it from scratch.
              (b) advance the highest-priority OPEN backlog item on a NEW branch cut from origin/main.
              (c) you are in the cloud runner — you MAY run `npm install --legacy-peer-deps` + `tsc`/`npm test`
                  here to sanity-check (it costs runner minutes, not Sean's box); the required CI is the authority.
              (d) push the branch, open a PR, and — ONLY if SAFE-CLASS (docs / shadow-inert / additive-tested) —
                  run `gh pr merge <n> --auto --squash` WHILE its checks are still pending, so GitHub lands it on green.
              (e) append a Beat entry to reports/2026-07-25/AUTONOMOUS_LOOP_LEDGER.md, on its OWN small branch/PR
                  (docs-only, SAFE-CLASS, auto-merge it immediately) SEPARATE from (b)'s branch. Open this ledger
                  PR right after (a)'s verification, before sinking turns into (b) — main has branch protection,
                  so there is no direct-push shortcut; a small early PR is what actually survives hitting the
                  turn cap later. If turns run out during (b)/(c)/(d), the ledger entry for THIS beat's step (a)
                  is already safely merged even though the new backlog work is not — that is the failure mode
                  to design for, not to just note after the fact.

            HARD LINES: verify before asserting ([V] not [R]); SHADOW-FIRST — NEVER flip Sean-gated enable flags
            (ENGINE_LLM_PROXY, ROUTER_STRICT_COST_ORDER, HAL_GROUNDING_MODE=enforce, REPID_PURPOSE_GATE_V3,
            real-money X402/STAKE); no secrets in code; NEVER an immediate/manual merge (only --auto on safe-class);
            never bulk-delete trinity_tasks; surface to Sean (in the ledger) ONLY a ready-merge-needing-him, a
            secret/infra flip, or a real fork. Keep this beat bounded and STOP when it is done.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools Edit,Read,Write,Bash,Glob,Grep
