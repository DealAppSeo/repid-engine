# CI workflow gating PRs to main — the "is CI green?" check.
#
# Steps (all run keyless — no secrets required):
#   1. npm ci --legacy-peer-deps  (deterministic install; matches nixpacks.toml)
#   2. npx tsc --noEmit           (type-check)
#   3. npm test                   (full Jest suite)
#
# Keyless design: src/config.ts throws "SUPABASE_URL … required" at import time, which would
# crash every DB-touching suite at load. tests/jest.setup.env.ts (wired via jest.config.js
# `setupFiles`) injects DUMMY Supabase creds so config loads, and raises REPID_TEST_DUMMY_DB=1
# so live-DB integration tests skip cleanly instead of hanging on a fake host. It does NOT set
# provider API keys, so the live golden-math tripwire (tests/hal/golden-math.test.ts) stays
# skipped — GA's keyed CI runs it for real. Result: pure-logic tests (HAL family/quorum,
# disjointness, decisioning, scoring) all run green without any secrets.
#
# Optional (Sean): to also run the live-DB integration suite + golden-math tripwire in CI,
# add repo secrets SUPABASE_URL / SUPABASE_SERVICE_KEY (+ provider keys) and a separate job.
# Not required for this workflow to pass. Make this a required check on main in
# Settings → Branches.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (legacy peer deps per nixpacks.toml)
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test (keyless — dummy creds injected by tests/jest.setup.env.ts)
        run: npm test
