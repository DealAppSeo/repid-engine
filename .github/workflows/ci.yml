# CC Sprint 8 — CI workflow gating PRs to main.
#
# Steps:
#   1. Type-check (always runs; no secrets needed)
#   2. Unit tests (always runs; no live DB)
#   3. Integration tests (skipped per-test if SUPABASE secrets absent;
#      runs full when secrets are present)
#
# Sean action items:
#   - In GitHub repo settings → Secrets and variables → Actions, add:
#       SUPABASE_URL                     (project-public URL)
#       SUPABASE_SERVICE_KEY             (service-role key — never log)
#       SMOKE_BASE_URL                   (https://repid-engine-production.up.railway.app)
#   - Enable Actions in the repo if not already on
#   - Make this workflow a required check on the main branch in
#     Settings → Branches → branch protection rule
#
# Without those secrets the workflow still runs typecheck + unit tests,
# which catch most regressions. Integration tests skip gracefully via
# the env-guard pattern in tests/integration/*.

name: CI

# NOTE on the `pull_request` trigger having NO `branches:` filter (2026-07-27):
# it used to read `pull_request: branches: [main]`, which meant a STACKED PR — one
# whose base is another feature branch, not `main` — never ran this workflow at all.
# PR #210 (base `feat/cc-2026-07-27-pcr-p2-retrieval`) sat green on `gitleaks` alone
# while `test` and `crosscheck` had literally never executed against it. The green
# checkmark was reporting on secret-scanning only, which is exactly the "a check that
# cannot fail proves nothing" failure mode in a new costume.
# Unfiltered = this runs on every PR regardless of base. That costs a couple of extra
# jobs per stacked-PR push and is the point. It is also a PRECONDITION for putting
# branch protection on `main`: required checks that never run on stacked PRs would
# block them permanently. `tests/ci-workflow-triggers.test.ts` pins this open.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # zkp-vault (Rust) — the Poseidon2 parity gate.
  #
  # WHY THIS EXISTS: until 2026-07-26 no workflow ran `cargo` at all, so the
  # entire ZKP parity chain (backlog 4.0-a..d) was gated only on a developer
  # machine. That chain is what makes ZKP_ARCHITECTURE_INVARIANTS Invariant 1
  # ("one hash, one field, in- and off-circuit") checkable rather than asserted:
  #   - poseidon2_2to1_kat.rs  — the committed KAT artifact vs a locally
  #     recomputed raw permutation (catches oracle drift)
  #   - poseidon2_leaf_kat.rs  — the leaf/pair KATs the TS port is gated against
  #   - lib.rs unit tests      — circuit <-> off-circuit H_p2 parity, plus the
  #     forgery test that gates the nullifier secret-binding constraint
  # A silent drift in any of these would previously reach main unchallenged.
  #
  # Deliberately NOT path-filtered: the TS side (src/zkp/poseidon2-*.ts) is
  # gated against the SAME committed KAT JSON, so a TS-only PR that edits the
  # artifact must still face the Rust gate.
  #
  # WHAT `--locked` DOES AND DOES NOT DO (corrected 2026-07-27): it freezes this
  # crate's tracked Cargo.lock, so a PR cannot silently move a p3-* version. It is
  # NOT the CANON P-026 / Invariant-5 Plonky3 pin — that pin is the git rev
  # 27d59f7350 used by the live prover, whereas zkp-vault depends on the crates.io
  # 0.3.0 family. Same family, different mechanism; don't conflate them.
  #
  # ACCEPTED RISK: `rust-toolchain@stable` floats, and with `-D warnings` on both
  # steps a future rustc that adds a lint can turn an unrelated PR red. Taken
  # knowingly — a loud, dated, one-line fix is preferred here over pinning a
  # toolchain that would then quietly rot against the p3 crates.
  # ---------------------------------------------------------------------------
  zkp-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zkp-vault

      - name: Build (warnings are failures — keeps the crate clean)
        working-directory: zkp-vault
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked

      # RUSTFLAGS is repeated here ON PURPOSE. `cargo build` never compiles
      # `#[cfg(test)]` code, so a build-only `-D warnings` leaves every test and
      # example module unguarded. That blind spot was proven by mutation
      # (2026-07-27): an unused import injected inside `mod tests` passed the
      # build step and merely warned during the test step — CI green. Which is
      # exactly where the warning this gate was written to catch had just been
      # moved to. Both steps carry the flag now.
      - name: Parity + KAT + soundness tests
        working-directory: zkp-vault
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked

      # BOTH PROFILES, ON PURPOSE (added 2026-09-04). `cargo test` above is a
      # DEBUG build, and two of the soundness gates this job's header advertises
      # -- "the forgery test that gates the nullifier secret-binding constraint"
      # -- assert that the PROVER panics on a forged trace. That panic is
      # Plonky3's `check_constraints`, compiled in only under `debug_assertions`.
      #
      # So under `--release` (the profile the crate actually ships) those gates
      # could not fire, `cargo test --release` had been RED with "did not panic
      # as expected", and CI never saw it because CI never built that profile.
      # The circuit was sound throughout -- the VERIFIER rejects both forgeries
      # -- but the gates were checking nothing in the shipped profile, which is
      # NOT CHECKED, not passed.
      #
      # The release-safe restatements (`*_in_any_profile`) assert the verifier
      # rejects, so they hold in either profile; this step is what keeps them
      # honest, and what stops the release profile going red again unobserved.
      # ~30s on a warm cache, and it is the profile that ships.
      - name: Soundness gates under the shipped profile (--release)
        working-directory: zkp-vault
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Production-extract fixture fence (the permanent #376 fence). Pure Node, so it
      # runs BEFORE install — a real proof / real agent UUID / prod table dump committed
      # under tests/ fails the PR here, independent of the branch-discipline pre-commit
      # hook (which only fires on a developer's machine). See scripts/hooks/prod-fixture-guard.js.
      - name: Prod-fixture fence (block committed production extracts)
        run: node scripts/hooks/prod-fixture-guard.js --ci

      - name: Install (legacy peer deps per nixpacks.toml)
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-key
        run: npm test

      - name: Integration tests
        env:
          # Disposable TEST Supabase project (ref ebiftjvrbsotpdthsyav) — NEVER prod.
          # Integration tests insert/update/delete; they must only touch the test DB.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_TEST }}
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: npm run test:integration
        # Write-path suites gate on prod-guard + schema-presence
        # (tests/helpers/describe-if-schema.ts): they SKIP (green) when the
        # test project is unseeded/empty, and RUN once its schema is seeded.
        # Tests also skip gracefully when env is unset (forks without secrets).
