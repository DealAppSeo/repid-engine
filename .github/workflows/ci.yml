# CC Sprint 8 — CI workflow gating PRs to main.
#
# Steps:
#   1. Type-check (always runs; no secrets needed)
#   2. Unit tests (always runs; no live DB)
#   3. Integration tests (skipped per-test if SUPABASE secrets absent;
#      runs full when secrets are present)
#
# Sean action items:
#   - In GitHub repo settings → Secrets and variables → Actions, add:
#       SUPABASE_URL                     (project-public URL)
#       SUPABASE_SERVICE_KEY             (service-role key — never log)
#       SMOKE_BASE_URL                   (https://repid-engine-production.up.railway.app)
#   - Enable Actions in the repo if not already on
#   - Make this workflow a required check on the main branch in
#     Settings → Branches → branch protection rule
#
# Without those secrets the workflow still runs typecheck + unit tests,
# which catch most regressions. Integration tests skip gracefully via
# the env-guard pattern in tests/integration/*.

name: CI

# NOTE on the `pull_request` trigger having NO `branches:` filter (2026-07-27):
# it used to read `pull_request: branches: [main]`, which meant a STACKED PR — one
# whose base is another feature branch, not `main` — never ran this workflow at all.
# PR #210 (base `feat/cc-2026-07-27-pcr-p2-retrieval`) sat green on `gitleaks` alone
# while `test` and `crosscheck` had literally never executed against it. The green
# checkmark was reporting on secret-scanning only, which is exactly the "a check that
# cannot fail proves nothing" failure mode in a new costume.
# Unfiltered = this runs on every PR regardless of base. That costs a couple of extra
# jobs per stacked-PR push and is the point. It is also a PRECONDITION for putting
# branch protection on `main`: required checks that never run on stacked PRs would
# block them permanently. `tests/ci-workflow-triggers.test.ts` pins this open.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install (legacy peer deps per nixpacks.toml)
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-key
        run: npm test

      - name: Integration tests
        env:
          # Disposable TEST Supabase project (ref ebiftjvrbsotpdthsyav) — NEVER prod.
          # Integration tests insert/update/delete; they must only touch the test DB.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_TEST }}
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: npm run test:integration
        # Write-path suites gate on prod-guard + schema-presence
        # (tests/helpers/describe-if-schema.ts): they SKIP (green) when the
        # test project is unseeded/empty, and RUN once its schema is seeded.
        # Tests also skip gracefully when env is unset (forks without secrets).
