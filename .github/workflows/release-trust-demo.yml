# Publish @hyperdag/trust-demo to npm from a tag, so releasing is a reviewable CI event
# rather than a command run on a laptop with publish rights.
#
# WHY THIS EXISTS. `npm publish` is irreversible: the version number is burned the moment
# it lands (unpublish is restricted after 72h, and a version can never be reused). A
# release that only exists as shell history on one machine cannot be audited, repeated, or
# handed to anyone else. This makes the tarball a build artefact of a specific commit.
#
# Sean action items (one-time):
#   - npmjs.com -> Access Tokens -> Generate -> "Automation" (bypasses 2FA for CI)
#   - GitHub repo Settings -> Secrets and variables -> Actions -> add NPM_TOKEN
#
# To release:
#   git tag trust-demo-v0.1.0 && git push origin trust-demo-v0.1.0
#
# Or run it manually from the Actions tab with dry_run=true to rehearse the whole thing
# without publishing anything. The dry run also answers "is NPM_TOKEN installed, and does
# it still work?" without publishing — see the credential step below for what that does
# and does not settle.
#
# THE GUARD THAT MATTERS. The tag and packages/trust-demo/package.json must agree on the
# version. Without that check, `git tag trust-demo-v0.2.0` on a tree still saying 0.1.0
# publishes 0.1.0 — and 0.2.0 silently never exists. The mismatch is invisible afterwards
# because both halves look internally consistent.

name: release-trust-demo

on:
  push:
    tags:
      - 'trust-demo-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  # Required for npm provenance: mints the OIDC token that cryptographically links the
  # published tarball to this workflow run and commit. Fitting for a package whose entire
  # argument is "verify it yourself rather than trusting the publisher".
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/trust-demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # ── the version guard ────────────────────────────────────────────────
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#trust-demo-v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants $TAG but package.json says $PKG. Bump one or the other — publishing here would ship $PKG under a $TAG tag."
            exit 1
          fi

      # ── does the credential actually work? ───────────────────────────────
      # A rehearsal that stops short of the one thing you are unsure about is not a
      # rehearsal. `npm publish --dry-run` is entirely local: it never contacts the
      # registry and never reads NODE_AUTH_TOKEN. So before this step a dry run went green
      # with no NPM_TOKEN at all, and the first real test of the credential was the tag
      # push — the irreversible one.
      #
      # WHAT THIS PROVES: the token is valid and the registry recognises it as some
      # account. WHAT IT DOES NOT PROVE: that the account may publish THIS name. There is
      # no way to ask npm "could I publish a name that does not exist yet" without
      # publishing it, so scope permission is still only settled by the real run. Printing
      # the username is what leaves that gap checkable by eye — it has to be an account
      # that owns @hyperdag.
      #
      # A MISSING SECRET IS NOT A FAILURE, BUT IT IS NEVER SILENCE. Rehearsing the
      # packaging guards before the token exists is a legitimate thing to want, so an
      # absent NPM_TOKEN warns and continues. It is then reported as NOT CHECKED in the
      # log, as a warning annotation, and in the job summary — because "we did not look"
      # reading as "it passed" is the exact failure this step exists to remove. A token
      # that IS present and gets rejected fails the run: a broken credential and an absent
      # one need different fixes, so they must not share an outcome.
      #
      # Probed against the live registry: absent -> ENEEDAUTH, wrong -> E401, and a
      # transport failure is neither. Reporting an unreachable registry as "your token is
      # bad" would send someone to rotate a credential that was fine, so the three stay
      # apart. Only the npm error CODE is echoed, never the body — that is the string a
      # token could ride out on.
      - name: Verify npm credential
        id: npm_auth
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "auth=not-checked" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set on this repository, so this rehearsal did NOT verify the publish credential — everything else still ran. Add it under Settings -> Secrets and variables -> Actions."
            echo "NPM_TOKEN absent — credential NOT verified. No other check in this run is affected."
            exit 0
          fi
          if ! OUT=$(npm whoami 2>&1); then
            # Pure bash, no pipes. `… | head -1` closes the reader after one line, and on
            # MULTI-LINE output the writer then takes SIGPIPE; `pipefail` turns that into a
            # failed pipeline and the `-e` Actions applies to every run block kills the
            # step. Measured: 50k short lines exits 141 with an empty $GITHUB_OUTPUT and no
            # message — the silent kind. (One long line does NOT trigger it: head reads to
            # the newline, so nothing closes early. The distinction is why this was probed
            # rather than reasoned about.)
            if [[ "$OUT" =~ npm\ error\ code\ ([A-Z0-9]+) ]]; then CODE="${BASH_REMATCH[1]}"; else CODE=""; fi
            echo "auth=rejected" >> "$GITHUB_OUTPUT"
            case "$CODE" in
              E401|ENEEDAUTH|EAUTHUNKNOWN)
                echo "::error::NPM_TOKEN is set but registry.npmjs.org rejected it ($CODE). A tag push would fail at the publish step. Check that it has not expired and that it is an Automation or granular token with write access to the @hyperdag scope."
                ;;
              *)
                echo "::error::Could not reach registry.npmjs.org to check the credential (${CODE:-no npm error code}). This is NOT a verdict on the token — do not rotate it on the strength of this. Re-run when the registry is reachable."
                ;;
            esac
            exit 1
          fi
          # Bound and sanitise before this reaches GITHUB_OUTPUT: the value arrives from
          # the network, and one carrying a newline can forge additional output keys.
          # Pipe-free for the same measured SIGPIPE reason as above.
          WHO=${OUT%%$'\n'*}
          WHO=${WHO//[^A-Za-z0-9._@-]/}
          WHO=${WHO:0:64}
          echo "auth=$WHO" >> "$GITHUB_OUTPUT"
          echo "registry.npmjs.org authenticated this token as: $WHO"
          echo "note: that proves the token is VALID, not that $WHO may publish @hyperdag/trust-demo."

      - name: Refuse to republish an existing version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "@hyperdag/trust-demo@$PKG" version >/dev/null 2>&1; then
            echo "::error::@hyperdag/trust-demo@$PKG is already on the registry. Versions are immutable — bump the version."
            exit 1
          fi
          echo "@hyperdag/trust-demo@$PKG is unpublished — ok to proceed."

      # ── the fences that gate the release ─────────────────────────────────
      # Only the suites covering this package. They need no SUPABASE secrets, so a release
      # never depends on credentials it has no business holding.
      - name: Install root dev deps (for jest + ts-jest)
        working-directory: .
        run: npm install --legacy-peer-deps

      - name: Equivalence + portability fences
        working-directory: .
        run: npx jest --config jest.config.js --forceExit tests/trust-demo-verify-equivalence.test.ts tests/demo-leaf-bin.test.ts

      - name: Prod-fixture fence (no production extract may ship)
        working-directory: .
        run: node scripts/hooks/prod-fixture-guard.js --ci

      # ── smoke-test the ARTEFACT, not the working tree ────────────────────
      # The thing users get is the tarball, so that is what gets tested: packed, installed
      # into a clean directory as a dependency, and invoked through its bin exactly the way
      # `npx` would. A green working tree has been wrong before; `files` omissions only
      # show up here.
      - name: Pack
        run: npm pack --pack-destination /tmp

      - name: Install the tarball clean and run it offline
        run: |
          PKG=$(node -p "require('./package.json').version")
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "/tmp/hyperdag-trust-demo-$PKG.tgz" --no-audit --no-fund
          # --offline exercises the real WASM verifier and the tamper rejections with no
          # network, so this asserts the cryptography works in the shipped artefact.
          OUT=$(./node_modules/.bin/trust-demo --offline --json)
          echo "$OUT" | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const r = JSON.parse(s);
              const p = r.legs.local_proof;
              if (p?.state !== 'REAL' || p.verified !== true) throw new Error('shipped tarball did not verify the proof: ' + JSON.stringify(p));
              if (!p.tampers?.length || !p.tampers.every(t => t.rejected)) throw new Error('shipped tarball accepted a tampered statement');
              console.log('smoke ok — proof verified, ' + p.tampers.length + ' tampers rejected, verifier v' + p.verifierVersion);
            });"

      # ── publish ──────────────────────────────────────────────────────────
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --provenance --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        env:
          # Via env rather than inline `${{ }}`: this value originates from the registry,
          # and interpolating it straight into the script would let it run as shell.
          NPM_AUTH: ${{ steps.npm_auth.outputs.auth }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          {
            echo "### @hyperdag/trust-demo@$PKG"
            echo ""
            echo "- trigger: \`${{ github.event_name }}\` (${{ github.ref_name }})"
            echo "- dry run: \`${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}\`"
            # Absent on the real publish path, where the step does not run at all. Silence
            # there is correct — the publish itself is the credential test. Silence on a
            # DRY RUN would not be, which is why not-checked is printed rather than skipped.
            case "${NPM_AUTH:-}" in
              '')           ;;
              not-checked)  echo "- npm credential: **NOT CHECKED** — \`NPM_TOKEN\` is not set on this repository" ;;
              rejected)     echo "- npm credential: **REJECTED** — see the failing step" ;;
              *)            echo "- npm credential: valid, authenticated as \`$NPM_AUTH\` (does not prove publish rights to this name)" ;;
            esac
            echo ""
            echo "\`\`\`"
            echo "npx @hyperdag/trust-demo"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
