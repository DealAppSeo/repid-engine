# CC Sprint 2026-05-30 — Cross-Check Harness CI gate.
#
# Re-derives the load-bearing claims (authority formula, F2 spoofing, RLS invariant,
# HAL discrimination, RepID guards) on every PR. A BLOCKING FAIL exits non-zero → the
# job fails → merge is blocked (once this is made a required check; see below).
#
# Why a separate workflow from ci.yml: this gate can be toggled / phased-in independently
# of the typecheck+test job, and reviewers see a distinct "crosscheck" status.
#
# ── Sean / Cowork action items ───────────────────────────────────────────────────────
#   1. Repo Settings → Secrets and variables → Actions → Secrets, add (if not present).
#      Read ONLY by `crosscheck-live` (push to main) — never by a PR run, see "WHY TWO JOBS":
#        SUPABASE_URL            project URL (rls + repid-guards checks)
#        SUPABASE_SERVICE_KEY    service-role key — never logged
#        GROQ_API_KEY            } HAL discrimination check. If any are absent the HAL
#        FIREWORKS_API_KEY       } check SKIPs (⚠️, never a silent pass) — it does not
#        CEREBRAS_API_KEY        } block merge on missing keys.
#   2. (Optional, transitional) Settings → … → Variables, add:
#        CROSSCHECK_WARN_ONLY = rls            demote a currently-failing pre-existing-gap
#        (or `rls,authority`)                   check to warn-only, so it doesn't block every
#                                               PR before the fix lands. Remove once remediated.
#   3. Cowork CO-SIGNS, then mark "crosscheck / crosscheck" a REQUIRED status check in
#        Settings → Branches → branch protection for main.
#
# NOTE: on `main` today the suite is RED for real reasons — the authority fix (min(R,100·√S))
# is not yet merged, and 8 critical tables have RLS off. Those are findings, not harness bugs.
# Merge GA's authority fix and decide RLS gating BEFORE flipping this to a required check.

name: crosscheck

# `pull_request` deliberately carries NO `branches:` filter — see the long note in
# ci.yml. A stacked PR (base = another feature branch) never ran this gate, so the
# claims this harness re-derives went unchecked on exactly the PRs that stack the
# most change. Pinned open by `tests/ci-workflow-triggers.test.ts`.
on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo. Artifact upload uses the runtime token, not this one.
permissions:
  contents: read

# WHY TWO JOBS (SEC-FIX-CI, 2026-10-21): agent lanes push branches to THIS repo, so their
# PRs are not forks and DO receive secrets. The old single job handed the PROD service-role
# key to every PR's code, and ran `npm install` (dependency install scripts) right before.
# A secret only reaches a runner when its job references it — a step-level `if:` or an
# expression that evaluates to '' does NOT keep it off the runner, where any PR code with
# sudo can read the worker's memory. So the PR job references no secret at all, and the
# prod-reading job only runs on push to main: code that already ships to Railway with the
# same key, so it adds no exposure.
#
# What a PR run loses: the six checks that read the live DB (rls, repid-guards,
# swarm-throughput, repid-floor, zkp-anchor, hal) SKIP with "needs SUPABASE_URL" — never a
# silent pass. They read prod STATE, not the PR's diff, so the _TEST project would only turn
# them into vacuous passes or false reds. They still run on every push to main.
jobs:
  crosscheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install (lockfile only, no dependency install scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: verify:crosscheck (code checks; live-DB checks SKIP)
        env:
          # Lets src/config boot with no hosted DB (g6 loads it); the verify suite's own
          # getDb() still sees no credentials, so DB checks SKIP with an honest reason.
          LOCAL_MODE: 'true'
          WARN_ONLY: ${{ vars.CROSSCHECK_WARN_ONLY || 'repid-floor' }}
        run: npm run verify:crosscheck

      - name: Upload crosscheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosscheck-report
          path: verify-crosscheck-report.json
          if-no-files-found: ignore

  crosscheck-live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install (lockfile only, no dependency install scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: verify:crosscheck (re-derive load-bearing claims)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # keep HAL fast/cheap in CI; raise/lower per provider budget.
          HAL_CHECK_SAMPLE: '24'
          # Cowork-controlled transitional phase-in (comma list of check ids → warn-only).
          # Default demote pre-existing real gaps (e.g. repid-floor pins from prior restore issues) to non-blocking
          # so crosscheck can be green for new changes; remove when underlying fixed (see Sean unblock).
          WARN_ONLY: ${{ vars.CROSSCHECK_WARN_ONLY || 'repid-floor' }}
        run: npm run verify:crosscheck

      - name: Upload crosscheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosscheck-report
          path: verify-crosscheck-report.json
          if-no-files-found: ignore
