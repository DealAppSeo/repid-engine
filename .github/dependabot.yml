# ADVISORY - version-update PRs only; nothing here is a required check.
# Weekly, with minor and patch bumps grouped into one PR per ecosystem so the queue stays
# reviewable. Major bumps arrive as their own PRs on purpose: they are the ones that break.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/trust-demo"
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Majors deliberately CLOSED unmerged on 2026-10-11 (PR numbers in brackets). Ignoring only
    # semver-major keeps minor/patch flowing through the group above; remove an entry here when
    # the migration is actually planned, so the major PR is raised again.
    ignore:
      - dependency-name: "typescript"             # 6.0.2 -> 7.0.2  [#1291]
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/bcryptjs"        # 2.4.6 -> 3.0.0  [#1292]
        update-types:
          - version-update:semver-major
      - dependency-name: "dotenv"                 # 17.4.2 -> 18.0.6 [#1293]
        update-types:
          - version-update:semver-major
      - dependency-name: "ioredis"                # 5.11.0 -> 6.0.0 [#1294]
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
