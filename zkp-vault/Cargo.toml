[package]
name = "zkp-vault"
version = "0.1.0"
edition = "2021"
description = "Real Plonky3 zero-knowledge vault — prove human-anonymous control of a registered agent identity (Semaphore-style membership + scoped nullifier). No reputation values appear in the circuit."

[dependencies]
# Plonky3: the ONE pin (ZKP Invariant 5, CANON P-026) = the live prover's rev, hyperdag-core
# services/zkp-postcard. Checked by scripts/zkp/plonky3-pins.cjs. Was crates.io 0.3.0 until 2026-11-17.
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# zkpv (src/bin/zkpv.rs): JSON in and out for the ERC-8004 validation demo.
serde_json = "1"
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3", rev = "27d59f7350daf6b02d11b01c3a55af453554b515" }

[features]
# OFF by default so the normal build/CI stays green. When enabled, the
# `recursion_spike` example includes the minimal "verify-a-proof-inside-a-proof"
# attempt, which FAILS TO COMPILE at this pin — that compile error IS the
# deliverable (it names the exact missing capability). Reproduce with:
#   cargo build --example recursion_spike --features attempt_incircuit_verify
attempt_incircuit_verify = []

[dev-dependencies]
# Test-only: reproduce p3-poseidon2's own published KAT vector as an independent
# plumbing check for the Poseidon2-BabyBear oracle (backlog 4.0-a). Same version
# p3-baby-bear uses for its Poseidon2 test vectors at the pinned rev (workspace rand_xoshiro 0.8).
rand_xoshiro = "0.8.0"

[profile.release]
opt-level = 3
