[package]
name = "zkp-vault"
version = "0.1.0"
edition = "2021"
description = "Real Plonky3 zero-knowledge vault for RepID — prove a tier/score is valid without revealing the score."

[dependencies]
p3-air = "0.3.0"
p3-baby-bear = "0.3.0"
p3-challenger = "0.3.0"
p3-commit = "0.3.0"
p3-dft = "0.3.0"
p3-field = "0.3.0"
p3-fri = "0.3.0"
p3-keccak = "0.3.0"
p3-matrix = "0.3.0"
p3-merkle-tree = "0.3.0"
p3-symmetric = "0.3.0"
p3-uni-stark = "0.3.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
# Test-only: reproduce p3-poseidon2's own published KAT vector as an independent
# plumbing check for the Poseidon2-BabyBear oracle (backlog 4.0-a). Same version
# p3-baby-bear 0.3.0 uses for its Poseidon2 test vectors.
rand_xoshiro = "0.7.0"

[profile.release]
opt-level = 3
